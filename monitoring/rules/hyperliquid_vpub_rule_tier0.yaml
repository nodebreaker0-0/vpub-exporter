# Tier 0 alert rules for vpub-exporter (US1, MVP).
#
# This file is the staging copy. The monitoring/ repo's parser wraps the
# content below in `{groups: [.]}` before promtool check, so for local
# verification we use `monitoring/rules/.checked-tier0.yaml` (auto-built by
# the Makefile promtool-check target) which adds the `groups:` wrapper.
#
# alert_level routing (contracts/alerts.md §5):
#   critical → PagerDuty + #ddoa-critical
#   high     → #ddoa-high
#   medium   → #ddoa-low
#   low      → #ddoa-low
#   disk     → #ddoa-disk
groups:
  - name: hyperliquid_vpub_tier0
    rules:
      - alert: VpubServiceDown
        expr: vpub_service_up == 0
        for: 1m
        labels:
          alert_level: critical
          chain: hyperliquid
        annotations:
          summary: "vpub: v-publisher.service down"
          description: "{{ $labels.instance }} v-publisher.service 가 1분 이상 inactive — bridge/oracle vote 누락 위험."

      - alert: VpubChildMissing
        expr: vpub_child_count < 3
        for: 30s
        labels:
          alert_level: critical
          chain: hyperliquid
        annotations:
          summary: "vpub: visor child 누락 ({{ $value }}/3)"
          description: "{{ $labels.instance }} visor child 수 = {{ $value }} (정상 3). bridge-voter / reference-oracle-publisher / outcome-voter 중 일부 hang/사망."

      - alert: VpubLogStale
        expr: time() - vpub_component_log_mtime_seconds > 300
        for: 2m
        labels:
          alert_level: high
          chain: hyperliquid
        annotations:
          summary: "vpub {{ $labels.component }} 로그 5분+ 멈춤"
          description: "{{ $labels.instance }} {{ $labels.component }} 로그 mtime 5분 이상 갱신 없음 — hang 가능."

      - alert: VpubLogStaleLong
        expr: time() - vpub_component_log_mtime_seconds > 1800
        for: 1m
        labels:
          alert_level: critical
          chain: hyperliquid
        annotations:
          summary: "vpub {{ $labels.component }} 로그 30분+ 멈춤"
          description: "{{ $labels.instance }} {{ $labels.component }} 30분+ hang — 즉시 점검."
