# /etc/systemd/system/vpub-exporter.service.d/mainnet.conf
#
# Drop-in override for mainnet hosts. Apply with:
#   sudo install -D -m 0644 mainnet.conf \
#     /etc/systemd/system/vpub-exporter.service.d/mainnet.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart vpub-exporter
#
# Differences vs the base unit (testnet, user=admin):
#   - User/Group ubuntu (HF mainnet validator-publisher README)
#   - WorkingDirectory + ExecStart binary path under /home/ubuntu
#   - ReadOnlyPaths covers publisher tree under /home/ubuntu/v-publisher
#   - MemoryMax bumped 200M → 400M to absorb the ~10× mainnet log throughput
#     (R-019b — burst from oracle/bridge ticks). CPU quota unchanged.

[Service]
User=ubuntu
Group=ubuntu
WorkingDirectory=/home/ubuntu/vpub-exporter
# Override the binary location too — install lays it under ubuntu's homedir.
ExecStart=
ExecStart=/home/ubuntu/vpub-exporter/bin/vpub-exporter \
  --listen-addr=:8002 \
  --service-name=validator-publisher.service \
  --scrape-interval=30s

# Re-target the read-only mount to mainnet's publisher home.
# Empty assignment clears the inherited list before re-adding.
ReadOnlyPaths=
ReadOnlyPaths=/home/ubuntu/v-publisher

# Mainnet log throughput is ~10× testnet. Headroom bump.
MemoryMax=400M
