# /etc/systemd/system/vpub-exporter.service.d/mainnet.conf
#
# ⚠️ DEPRECATED in R-027 (2026-06-08).
#
# Reason: the MemoryMax=400M cgroup hit Go runtime startup memory on testnet
# (200M base) and produced fork() EAGAIN → status=203/EXEC → infinite restart
# (~913 cycles before manual intervention). Removing the cgroup limit fixed
# the loop. The simplified base unit now sufficient for both networks; the
# only mainnet-specific changes (user/working dir/binary path/ReadOnlyPaths)
# are applied directly to /etc/systemd/system/vpub-exporter.service via sed
# during install (see README.md mainnet rollout section).
#
# Reinstate this drop-in (or an updated version) only after 24h+ of mainnet
# RSS measurement establishes a safe MemoryMax value (e.g. observed_p99_RSS × 3).
#
# --- Original drop-in below for reference. Do NOT install without re-evaluation ---

[Service]
User=ubuntu
Group=ubuntu
WorkingDirectory=/home/ubuntu/vpub-exporter
ExecStart=
ExecStart=/home/ubuntu/vpub-exporter/bin/vpub-exporter \
  --listen-addr=:8002 \
  --service-name=validator-publisher.service \
  --scrape-interval=30s

ReadOnlyPaths=
ReadOnlyPaths=/home/ubuntu/v-publisher

# ⚠️ R-027: do not reapply MemoryMax/CPUQuota without RSS measurement first.
# MemoryMax=400M
