# Tier 0 alert rules for vpub-exporter (US1, MVP).
#
# monitoring 레포의 parser 가 PR merge 시 `{groups: [.]}` 로 wrap 후 promtool check.
# 따라서 이 파일은 **단일 RuleGroup 노드** (name + rules:) 로 작성.
# 라벨 컨벤션 (기존 monitoring/config/rules/*.yaml 일관):
#   - alertEvent : 룰 식별자 (콜론 구분)
#   - alertLevel : critical / high / medium / low / disk 중 하나
#   - instance / target : Prometheus / scrape 자동 라벨
#   - chain : "hyperliquid"
# 인스턴스 단위로 알람 일시 끄기: 메트릭에 disable_alarm='true' 라벨 (기존 컨벤션 차용).
#
# 로컬 검증:
#   promtool check rules monitoring/rules/hyperliquid_vpub_rule_tier0.yaml
name: hyperliquid_vpub_rule_tier0
rules:
  - alert: VpubServiceDown
    expr: vpub_service_up{disable_alarm!='true',network!="testnet"} == 0
    for: 1m
    labels:
      alertEvent: vpub:service:down
      alertLevel: critical
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: validator-publisher.service down'
      description: '[mainnet] {{ $labels.instance }} validator-publisher.service 가 1분 이상 inactive — bridge/oracle vote 누락 위험.'
  - alert: VpubServiceDownTestnet
    expr: vpub_service_up{disable_alarm!='true',network="testnet"} == 0
    for: 1m
    labels:
      alertEvent: vpub:service:down:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: validator-publisher.service down'
      description: '[testnet] {{ $labels.instance }} validator-publisher.service 가 1분 이상 inactive — bridge/oracle vote 누락 위험.'
  - alert: VpubChildMissing
    # R-022a: visor restart loop (5s cycle) 가 30s scrape sampling 으로 missed.
    # min_over_time 으로 5분 window 안 1회 dip 잡음. R-022b 의 restart counter 와 보완.
    expr: min_over_time(vpub_child_count{disable_alarm!='true',network!="testnet"}[5m]) < 3
    for: 30s
    labels:
      alertEvent: vpub:visor:child_missing
      alertLevel: critical
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: visor child 누락 (5m 내 min={{ $value }}/3)'
      description: '[mainnet] {{ $labels.instance }} visor child 수가 5분 안 한 번이라도 3 미만 = restart loop 가능성.'
  - alert: VpubChildMissingTestnet
    expr: min_over_time(vpub_child_count{disable_alarm!='true',network="testnet"}[5m]) < 3
    for: 30s
    labels:
      alertEvent: vpub:visor:child_missing:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: visor child 누락 ({{ $value }}/3)'
      description: '[testnet] {{ $labels.instance }} visor child 수 = {{ $value }} (정상 3). bridge-voter / reference-oracle-publisher / outcome-voter 중 일부 hang/사망.'
  - alert: VpubLogStale
    expr: (time() - vpub_component_log_mtime_seconds{disable_alarm!='true',component!="visor"}) > 300
    for: 2m
    labels:
      alertEvent: vpub:log:stale
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: vpub {{ $labels.component }} 로그 5분+ 멈춤
      description: '{{ $labels.instance }} {{ $labels.component }} 로그 mtime 5분 이상 갱신 없음 — hang 가능.'
  - alert: VpubLogStaleLong
    expr: (time() - vpub_component_log_mtime_seconds{disable_alarm!='true',network!="testnet",component!="visor"}) > 1800
    for: 1m
    labels:
      alertEvent: vpub:log:stale_long
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: vpub {{ $labels.component }} 로그 30분+ 멈춤
      description: '[mainnet] {{ $labels.instance }} {{ $labels.component }} 30분+ hang — 즉시 점검.'
  - alert: VpubLogStaleLongTestnet
    expr: (time() - vpub_component_log_mtime_seconds{disable_alarm!='true',network="testnet",component!="visor"}) > 1800
    for: 1m
    labels:
      alertEvent: vpub:log:stale_long:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: vpub {{ $labels.component }} 로그 30분+ 멈춤
      description: '[testnet] {{ $labels.instance }} {{ $labels.component }} 30분+ hang — 즉시 점검.'
  # R-022b: visor child restart loop 잡기 — 5s cycle 이라 vpub_child_count sampling 으로는 안 보임.
  - alert: VpubVisorChildRestartLoop
    expr: sum by (instance) (increase(vpub_visor_child_restart_total{disable_alarm!='true',network!="testnet"}[5m])) >= 5
    for: 1m
    labels:
      alertEvent: vpub:visor:child_restart_loop
      alertLevel: critical
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: visor child restart loop ({{ $value }} restarts/5m)'
      description: '[mainnet] {{ $labels.instance }} visor 가 child 를 5분에 {{ $value }}회 restart — version skew / spawn 실패 의심. journalctl -u validator-publisher 확인.'
  - alert: VpubVisorChildRestartLoopTestnet
    expr: sum by (instance) (increase(vpub_visor_child_restart_total{disable_alarm!='true',network="testnet"}[5m])) >= 5
    for: 1m
    labels:
      alertEvent: vpub:visor:child_restart_loop:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: visor child restart loop ({{ $value }} restarts/5m)'
      description: '[testnet] {{ $labels.instance }} visor restart loop.'
  - alert: VpubVisorCrit
    expr: increase(vpub_visor_crit_total{disable_alarm!='true',network!="testnet"}[5m]) > 0
    for: 1m
    labels:
      alertEvent: vpub:visor:crit
      alertLevel: critical
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: visor 자체 CRIT 로그 발생 ({{ $value }}건/5m)'
      description: '[mainnet] {{ $labels.instance }} visor process 가 CRIT/ERROR 라인 출력 — managed process exit / visor run failed 등. 즉시 진단.'
  - alert: VpubVisorCritTestnet
    expr: increase(vpub_visor_crit_total{disable_alarm!='true',network="testnet"}[5m]) > 0
    for: 1m
    labels:
      alertEvent: vpub:visor:crit:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: visor CRIT 로그 ({{ $value }}건/5m)'
      description: '[testnet] visor CRIT — 진단.'
