name: release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: make build-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: bin/vpub-exporter-linux-amd64
