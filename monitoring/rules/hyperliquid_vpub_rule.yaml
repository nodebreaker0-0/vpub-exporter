# vpub-exporter alert rules — Tier 0 + Tier 1 merged.
# Generated by cowork; source of truth = vpub-exporter/specs/001-vpub-exporter/contracts/alerts.md.
# monitoring/parser wraps this in {groups: [.]} at PR merge → promtool check rules.
#
# alertLevel routing (alertmanager.toml): critical → PagerDuty + #ddoa-critical / high → #ddoa-high
#                                         medium|low → #ddoa-low / disk → #ddoa-disk
#
# Network split (testnet vs mainnet):
#   1. critical alerts (6) → mainnet only + testnet duplicate as high (PagerDuty noise X)
#   2. VpubBridgeStaleVote → mainnet only (testnet has 0 Arbitrum deposit traffic,
#      vpub_bridge_last_vote_success_unix never advances → would fire forever).
# Mainnet rules use network!="testnet" matcher (covers future networks too).
#
# VpubLogStale/Long exclude component="visor" — visor is a spawn manager with
# rare self-log writes; staleness has no operational meaning for it.
name: hyperliquid_vpub_rule
rules:
  - alert: VpubServiceDown
    expr: vpub_service_up{disable_alarm!='true',network!="testnet"} == 0
    for: 1m
    labels:
      alertEvent: vpub:service:down
      alertLevel: critical
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: validator-publisher.service down'
      description: '[mainnet] {{ $labels.instance }} validator-publisher.service 가
        1분 이상 inactive — bridge/oracle vote 누락 위험.'
  - alert: VpubServiceDownTestnet
    expr: vpub_service_up{disable_alarm!='true',network="testnet"} == 0
    for: 1m
    labels:
      alertEvent: vpub:service:down:testnet
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: validator-publisher.service down'
      description: '[testnet] {{ $labels.instance }} validator-publisher.service 가
        1분 이상 inactive — bridge/oracle vote 누락 위험.'
  - alert: VpubChildMissing
    expr: vpub_child_count{disable_alarm!='true',network!="testnet"} < 3
    for: 30s
    labels:
      alertEvent: vpub:visor:child_missing
      alertLevel: critical
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: visor child 누락 ({{ $value }}/3)'
      description: '[mainnet] {{ $labels.instance }} visor child 수 = {{ $value }}
        (정상 3). bridge-voter / reference-oracle-publisher / outcome-voter 중 일부 hang/사망.'
  - alert: VpubChildMissingTestnet
    expr: vpub_child_count{disable_alarm!='true',network="testnet"} < 3
    for: 30s
    labels:
      alertEvent: vpub:visor:child_missing:testnet
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: visor child 누락 ({{ $value }}/3)'
      description: '[testnet] {{ $labels.instance }} visor child 수 = {{ $value }}
        (정상 3). bridge-voter / reference-oracle-publisher / outcome-voter 중 일부 hang/사망.'
  - alert: VpubLogStale
    expr: (time() - vpub_component_log_mtime_seconds{disable_alarm!='true',component!="visor"})
      > 300
    for: 2m
    labels:
      alertEvent: vpub:log:stale
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: vpub {{ $labels.component }} 로그 5분+ 멈춤
      description: '{{ $labels.instance }} {{ $labels.component }} 로그 mtime 5분 이상
        갱신 없음 — hang 가능.'
  - alert: VpubLogStaleLong
    expr: (time() - vpub_component_log_mtime_seconds{disable_alarm!='true',network!="testnet",component!="visor"})
      > 1800
    for: 1m
    labels:
      alertEvent: vpub:log:stale_long
      alertLevel: critical
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: vpub {{ $labels.component }} 로그 30분+ 멈춤
      description: '[mainnet] {{ $labels.instance }} {{ $labels.component }} 30분+
        hang — 즉시 점검.'
  - alert: VpubLogStaleLongTestnet
    expr: (time() - vpub_component_log_mtime_seconds{disable_alarm!='true',network="testnet",component!="visor"})
      > 1800
    for: 1m
    labels:
      alertEvent: vpub:log:stale_long:testnet
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: vpub {{ $labels.component }} 로그 30분+ 멈춤
      description: '[testnet] {{ $labels.instance }} {{ $labels.component }} 30분+
        hang — 즉시 점검.'
  - alert: VpubBridgeRpcMajorityDown
    expr: sum by (instance) (vpub_bridge_rpc_up{disable_alarm!='true'}) < 4
    for: 5m
    labels:
      alertEvent: vpub:bridge:rpc_quorum
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: RPC quorum 위태 ({{ $value }}/7)'
      description: 메인넷 RPC 살아있는 수 = {{ $value }} (임시 임계 ≥4 — R-005 확정 후 정정)
  - alert: VpubBridgeRpcSingleDown
    expr: vpub_bridge_rpc_up{disable_alarm!='true'} == 0
    for: 10m
    labels:
      alertEvent: vpub:bridge:rpc_down
      alertLevel: medium
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: RPC {{ $labels.name }} down'
      description: '{{ $labels.instance }} bridge voter 의 RPC {{ $labels.name }} 10분+
        down'
  - alert: VpubBridgeRpcDisagreement
    expr: increase(vpub_bridge_rpc_disagreement_total{disable_alarm!='true'}[15m])
      > 5
    for: 2m
    labels:
      alertEvent: vpub:bridge:disagreement
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: RPC disagreement 빈발'
      description: 15분 내 RPC 합의 실패 {{ $value }} 건 — 잘못된 vote 위험
  - alert: VpubBridgeStaleVote
    expr: (time() - vpub_bridge_last_vote_success_unix{disable_alarm!='true',network!="testnet"})
      > 3600
    for: 5m
    labels:
      alertEvent: vpub:bridge:stale_vote
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: 1h+ 성공 vote 없음'
      description: '[mainnet] {{ $labels.instance }} 마지막 성공 bridge vote 이후 1h 경과'
  - alert: VpubBridgeStaleVoteLong
    expr: (time() - vpub_bridge_last_vote_success_unix{disable_alarm!='true',network!="testnet"})
      > 21600
    for: 5m
    labels:
      alertEvent: vpub:bridge:stale_vote_long
      alertLevel: critical
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: 6h+ 성공 vote 없음'
      description: '[mainnet] {{ $labels.instance }} 마지막 성공 bridge vote 이후 6h 경과 —
        비정상'
  - alert: VpubBridgeStaleVoteLongTestnet
    expr: (time() - vpub_bridge_last_vote_success_unix{disable_alarm!='true',network="testnet"})
      > 21600
    for: 5m
    labels:
      alertEvent: vpub:bridge:stale_vote_long:testnet
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: 6h+ 성공 vote 없음'
      description: '[testnet] {{ $labels.instance }} 마지막 성공 bridge vote 이후 6h 경과 —
        비정상'
  - alert: VpubBridgeAllFail
    expr: "(\n  increase(vpub_bridge_vote_total{status=\"ok\",disable_alarm!='true'}[1h])\
      \ == 0\n  and\n  increase(vpub_bridge_vote_total{status=\"fail\",disable_alarm!='true'}[1h])\
      \ > 0\n)\n"
    for: 5m
    labels:
      alertEvent: vpub:bridge:all_fail
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: 1h 시도 vote 전부 실패'
      description: '{{ $labels.instance }} 최근 1h vote 시도가 있었지만 모두 실패'
  - alert: VpubOracleStaleVote
    expr: (time() - vpub_oracle_last_vote_success_unix{disable_alarm!='true'}) > 300
    for: 5m
    labels:
      alertEvent: vpub:oracle:stale_vote
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub oracle: 5m+ 성공 vote 없음'
      description: '{{ $labels.instance }} 마지막 reference oracle update 이후 5m+ (정상
        평균 4.3s)'
  - alert: VpubOracleStaleVoteLong
    expr: (time() - vpub_oracle_last_vote_success_unix{disable_alarm!='true',network!="testnet"})
      > 1800
    for: 1m
    labels:
      alertEvent: vpub:oracle:stale_vote_long
      alertLevel: critical
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub oracle: 30m+ 성공 vote 없음'
      description: '[mainnet] {{ $labels.instance }} reference oracle 사실상 정지 — oracle
        미참여 손실'
  - alert: VpubOracleStaleVoteLongTestnet
    expr: (time() - vpub_oracle_last_vote_success_unix{disable_alarm!='true',network="testnet"})
      > 1800
    for: 1m
    labels:
      alertEvent: vpub:oracle:stale_vote_long:testnet
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub oracle: 30m+ 성공 vote 없음'
      description: '[testnet] {{ $labels.instance }} reference oracle 사실상 정지 — oracle
        미참여 손실'
  - alert: VpubBridgeStateStuck
    expr: delta(vpub_bridge_state_last_scanned_block{disable_alarm!='true'}[5m]) ==
      0
    for: 2m
    labels:
      alertEvent: vpub:bridge:state_stuck
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: state 진행 멈춤 (5m)'
      description: '{{ $labels.instance }} bridge-voter-state.json last_scanned_block
        5분 이상 변화 없음 — Arbitrum 스캔 정지'
  - alert: VpubBridgeRpcAuthError
    expr: increase(vpub_bridge_rpc_check_total{status="auth_error",disable_alarm!='true'}[10m])
      > 5
    for: 1m
    labels:
      alertEvent: vpub:bridge:rpc_auth_error
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: RPC {{ $labels.name }} 인증 실패 빈발'
      description: 10분 내 RPC 401 응답 {{ $value }}회 — 키 만료/오류 의심
  - alert: VpubOutcomePendingLong
    expr: vpub_outcome_slack_msg_24h{disable_alarm!='true'} > 5
    for: 30m
    labels:
      alertEvent: vpub:outcome:pending
      alertLevel: medium
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub outcome: 미검토 액션 적체 ({{ $value }}/24h)'
      description: 최근 24h outcome 채널 메시지 {{ $value }} 건 — 검토 진행 필요
  - alert: VpubSlackTokenInvalid
    expr: vpub_slack_api_ok{disable_alarm!='true',network!="testnet"} == 0
    for: 5m
    labels:
      alertEvent: vpub:slack:token_invalid
      alertLevel: critical
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: Slack token 만료 / API down'
      description: '[mainnet] publisher 가 보내는 모든 슬랙 알람이 누락 중일 수 있음 (auth.test fail)'
  - alert: VpubSlackTokenInvalidTestnet
    expr: vpub_slack_api_ok{disable_alarm!='true',network="testnet"} == 0
    for: 5m
    labels:
      alertEvent: vpub:slack:token_invalid:testnet
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: Slack token 만료 / API down'
      description: '[testnet] publisher 가 보내는 모든 슬랙 알람이 누락 중일 수 있음 (auth.test fail)'
