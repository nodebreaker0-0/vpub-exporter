# Tier 2 alert rules for vpub-exporter (US3 — binary upgrade tracking).
#
# monitoring 레포의 parser 가 PR merge 시 `{groups: [.]}` 로 wrap 후 promtool check.
# 따라서 이 파일은 단일 RuleGroup 노드 (name + rules:) 로 작성.
#
# 사용자 결정 (2026-05-23): detection budget 단축.
#   기존  : HEAD 10m + expr >3600 + for 30m → max 41분
#   현재  : HEAD 1m  + expr >60   + for 1m  → max ~3분
#   trade-off : 매분 HEAD = ~60 req/h — 무시 가능. 발견 즉시 운영자 알림 가치 >> 트래픽.
#
# 로컬 검증: `make promtool-check`.
name: hyperliquid_vpub_rule_tier2
rules:
  - alert: VpubBinaryUpdateAvailable
    # 60초만에 remote 가 local 보다 새로 보이면 HF 가 announce 한 것.
    # for: 1m 으로 transient race (mtime 부동소수 등) 흡수.
    expr: (vpub_binary_remote_mtime_unix{disable_alarm!='true'} - vpub_binary_local_mtime_unix) > 60
    for: 1m
    labels:
      alertEvent: "vpub:binary:update"
      alertLevel: "medium"
      instance: "{{ $labels.instance }}"
      target: "{{ $labels.target }}"
      chain: "hyperliquid"
    annotations:
      summary: "vpub: 새 publisher 바이너리 announced (remote +{{ $value }}s)"
      description: "{{ $labels.instance }} remote Last-Modified 가 local mtime 보다 1분+ 신규 — HF announce. 변경사항 검토 후 수동 업그레이드."

  - alert: VpubBinaryRemoteCheckFail
    expr: vpub_binary_remote_check_ok{disable_alarm!='true'} == 0
    for: 10m
    labels:
      alertEvent: "vpub:binary:check_fail"
      alertLevel: "low"
      instance: "{{ $labels.instance }}"
      target: "{{ $labels.target }}"
      chain: "hyperliquid"
    annotations:
      summary: "vpub: binary URL HEAD 10m+ 실패"
      description: "{{ $labels.instance }} 업그레이드 트래킹 비활성 — VPUB_BINARY_URL / 네트워크 점검."
