# Tier 1 alert rules for vpub-exporter (US2 — component 본업 추적).
#
# monitoring 레포의 parser 가 PR merge 시 `{groups: [.]}` 로 wrap 후 promtool check.
# 따라서 이 파일은 단일 RuleGroup 노드 (name + rules:) 로 작성.
# 라벨 컨벤션: alertEvent / alertLevel / instance / target / chain / disable_alarm 필터.
# alertLevel 5종(critical / high / medium / low / disk) 안에서만 사용.
#
# R-003/R-004 ✅ 확정 (2026-05-23 testnet 9.7h 실관찰):
#   - oracle 평균 4.3s / max 102s   → VpubOracleStaleVote 임계 300s (high)
#   - oracle 30m+ 정지              → VpubOracleStaleVoteLong (critical)
#   - bridge state 5m 정체          → VpubBridgeStateStuck (high) — 가장 강한 신호
#   - alchemy 401 (Must be authenticated!) → VpubBridgeRpcAuthError (high)
#
# Mainnet RPC quorum (R-005) 는 가동 직전 확정 — 현재 < 4 임시.
#
# 로컬 검증: `make promtool-check`.
name: hyperliquid_vpub_rule_tier1
rules:
  - alert: VpubBridgeRpcMajorityDown
    expr: sum by (instance, network) (vpub_bridge_rpc_up{disable_alarm!='true',network!="testnet"}) < 4
    for: 5m
    labels:
      alertEvent: vpub:bridge:rpc_quorum
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: RPC quorum 위태 ({{ $value }}/7)'
      description: '[mainnet] 메인넷 RPC 살아있는 수 = {{ $value }} (임시 임계 ≥4 — R-005 확정 후 정정)'
  - alert: VpubBridgeRpcMajorityDownTestnet
    expr: sum by (instance, network) (vpub_bridge_rpc_up{disable_alarm!='true',network="testnet"}) < 2
    for: 5m
    labels:
      alertEvent: vpub:bridge:rpc_quorum:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: RPC quorum 위태 (testnet 1개만 남음)'
      description: '[testnet] RPC 살아있는 수 = {{ $value }} (testnet max 3, 임계 <2)'
  - alert: VpubBridgeRpcSingleDown
    expr: vpub_bridge_rpc_up{disable_alarm!='true'} == 0
    for: 10m
    labels:
      alertEvent: vpub:bridge:rpc_down
      alertLevel: medium
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: RPC {{ $labels.name }} down'
      description: '{{ $labels.instance }} bridge voter 의 RPC {{ $labels.name }} 10분+ down'
  - alert: VpubBridgeRpcDisagreement
    expr: increase(vpub_bridge_rpc_disagreement_total{disable_alarm!='true',network!="testnet"}[5m]) >= 2
    for: 1m
    labels:
      alertEvent: vpub:bridge:disagreement
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: RPC disagreement 2+ (vote fail)'
      description: '[mainnet] 5분 내 RPC 합의 실패 {{ $value }}건 — vote 1+ 실패 가능 (4/7 quorum + ≤1 disagree 정의 위반)'
  - alert: VpubBridgeRpcDisagreementTestnet
    expr: increase(vpub_bridge_rpc_disagreement_total{disable_alarm!='true',network="testnet"}[5m]) >= 2
    for: 1m
    labels:
      alertEvent: vpub:bridge:disagreement:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: RPC disagreement 2+ (vote fail)'
      description: '[testnet] 5분 내 RPC 합의 실패 {{ $value }}건 — vote 1+ 실패 가능 (4/7 quorum + ≤1 disagree 정의 위반)'
  - alert: VpubBridgeStaleVote
    expr: (time() - vpub_bridge_last_vote_success_unix{disable_alarm!='true',network!="testnet"}) > 1800
    for: 5m
    labels:
      alertEvent: vpub:bridge:stale_vote
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: 1h+ 성공 vote 없음'
      description: '[mainnet] {{ $labels.instance }} 마지막 성공 bridge vote 이후 1h 경과'
  - alert: VpubBridgeStaleVoteLong
    expr: (time() - vpub_bridge_last_vote_success_unix{disable_alarm!='true',network!="testnet"}) > 7200
    for: 5m
    labels:
      alertEvent: vpub:bridge:stale_vote_long
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: 6h+ 성공 vote 없음'
      description: '[mainnet] {{ $labels.instance }} 마지막 성공 bridge vote 이후 6h 경과 — 비정상. mainnet 가동 후 실측 vote 빈도에 맞춰 임계 재조정 예정 (R-017b/R-020)'
  - alert: VpubBridgeStaleVoteLongTestnet
    expr: (time() - vpub_bridge_last_vote_success_unix{disable_alarm!='true',network="testnet"}) > 604800
    for: 5m
    labels:
      alertEvent: vpub:bridge:stale_vote_long:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: 7d+ 성공 vote 없음 (testnet)'
      description: '[testnet] {{ $labels.instance }} 마지막 성공 bridge vote 이후 7d 경과 — 비정상'
  - alert: VpubBridgeAllFail
    expr: |
      (
        increase(vpub_bridge_vote_total{status="ok",disable_alarm!='true',network!="testnet"}[1h]) == 0
        and
        increase(vpub_bridge_vote_total{status="fail",disable_alarm!='true',network!="testnet"}[1h]) > 0
      )
    for: 5m
    labels:
      alertEvent: vpub:bridge:all_fail
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: 1h 시도 vote 전부 실패'
      description: '[mainnet] {{ $labels.instance }} 최근 1h vote 시도가 있었지만 모두 실패'
  - alert: VpubBridgeAllFailTestnet
    expr: |
      (
        increase(vpub_bridge_vote_total{status="ok",disable_alarm!='true',network="testnet"}[1h]) == 0
        and
        increase(vpub_bridge_vote_total{status="fail",disable_alarm!='true',network="testnet"}[1h]) > 0
      )
    for: 5m
    labels:
      alertEvent: vpub:bridge:all_fail:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: 1h 시도 vote 전부 실패'
      description: '[testnet] {{ $labels.instance }} 최근 1h vote 시도가 있었지만 모두 실패'
  - alert: VpubOracleStaleVote
    expr: (time() - vpub_oracle_last_vote_success_unix{disable_alarm!='true',network!="testnet"}) > 60
    for: 5m
    labels:
      alertEvent: vpub:oracle:stale_vote
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub oracle: 5m+ 성공 vote 없음'
      description: '[mainnet] {{ $labels.instance }} 마지막 reference oracle update 이후 5m+ (정상 평균 4.3s)'
  - alert: VpubOracleStaleVoteTestnet
    expr: (time() - vpub_oracle_last_vote_success_unix{disable_alarm!='true',network="testnet"}) > 60
    for: 5m
    labels:
      alertEvent: vpub:oracle:stale_vote:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub oracle: 5m+ 성공 vote 없음'
      description: '[testnet] {{ $labels.instance }} 마지막 reference oracle update 이후 5m+ (정상 평균 4.3s)'
  - alert: VpubOracleStaleVoteLong
    expr: (time() - vpub_oracle_last_vote_success_unix{disable_alarm!='true',network!="testnet"}) > 300
    for: 1m
    labels:
      alertEvent: vpub:oracle:stale_vote_long
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub oracle: 30m+ 성공 vote 없음'
      description: '[mainnet] {{ $labels.instance }} reference oracle 사실상 정지 — oracle 미참여 손실'
  - alert: VpubOracleStaleVoteLongTestnet
    expr: (time() - vpub_oracle_last_vote_success_unix{disable_alarm!='true',network="testnet"}) > 1800
    for: 1m
    labels:
      alertEvent: vpub:oracle:stale_vote_long:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub oracle: 30m+ 성공 vote 없음'
      description: '[testnet] {{ $labels.instance }} reference oracle 사실상 정지 — oracle 미참여 손실'
  - alert: VpubBridgeStateStuck
    expr: delta(vpub_bridge_state_last_scanned_block{disable_alarm!='true',network!="testnet"}[5m]) == 0
    for: 2m
    labels:
      alertEvent: vpub:bridge:state_stuck
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: state 진행 멈춤 (5m)'
      description: '[mainnet] {{ $labels.instance }} bridge-voter-state.json last_scanned_block 5분 이상 변화 없음 — bridge_voter 또는 Arbitrum 스캔 정지 (R-021 jail-safe)'
  - alert: VpubBridgeStateStuckTestnet
    expr: delta(vpub_bridge_state_last_scanned_block{disable_alarm!='true',network="testnet"}[5m]) == 0
    for: 2m
    labels:
      alertEvent: vpub:bridge:state_stuck:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: state 진행 멈춤 (5m)'
      description: '[testnet] {{ $labels.instance }} bridge-voter-state.json last_scanned_block 5분 이상 변화 없음 — bridge_voter 또는 Arbitrum 스캔 정지 (R-021 jail-safe)'
  - alert: VpubBridgeRpcAuthError
    expr: increase(vpub_bridge_rpc_check_total{status="auth_error",disable_alarm!='true',network!="testnet"}[10m]) > 5
    for: 1m
    labels:
      alertEvent: vpub:bridge:rpc_auth_error
      alertLevel: high
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: RPC {{ $labels.name }} 인증 실패 빈발'
      description: '[mainnet] 10분 내 RPC 401 응답 {{ $value }}회 — 키 만료/오류 의심'
  - alert: VpubBridgeRpcAuthErrorTestnet
    expr: increase(vpub_bridge_rpc_check_total{status="auth_error",disable_alarm!='true',network="testnet"}[10m]) > 5
    for: 1m
    labels:
      alertEvent: vpub:bridge:rpc_auth_error:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub bridge: RPC {{ $labels.name }} 인증 실패 빈발'
      description: '[testnet] 10분 내 RPC 401 응답 {{ $value }}회 — 키 만료/오류 의심'
  - alert: VpubOutcomePendingLong
    expr: vpub_outcome_slack_msg_24h{disable_alarm!='true'} > 5
    for: 30m
    labels:
      alertEvent: vpub:outcome:pending
      alertLevel: medium
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub outcome: 미검토 액션 적체 ({{ $value }}/24h)'
      description: 최근 24h outcome 채널 메시지 {{ $value }} 건 — 검토 진행 필요
  - alert: VpubSlackTokenInvalid
    expr: vpub_slack_api_ok{disable_alarm!='true',network!="testnet"} == 0
    for: 5m
    labels:
      alertEvent: vpub:slack:token_invalid
      alertLevel: critical
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: Slack token 만료 / API down'
      description: '[mainnet] publisher 가 보내는 모든 슬랙 알람이 누락 중일 수 있음 (auth.test fail)'
  - alert: VpubSlackTokenInvalidTestnet
    expr: vpub_slack_api_ok{disable_alarm!='true',network="testnet"} == 0
    for: 5m
    labels:
      alertEvent: vpub:slack:token_invalid:testnet
      alertLevel: low
      instance: '{{ $labels.instance }}'
      target: '{{ $labels.target }}'
      chain: hyperliquid
    annotations:
      summary: 'vpub: Slack token 만료 / API down'
      description: '[testnet] publisher 가 보내는 모든 슬랙 알람이 누락 중일 수 있음 (auth.test fail)'
